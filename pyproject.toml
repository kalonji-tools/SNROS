[project]
name = "snros"
version = "0.0.0"
requires-python = ">=3.14"

[dependency-groups]
docs = [
  "mkdocs-material",
  "mkdocs-awesome-pages-plugin",
  "mkdocs-git-revision-date-localized-plugin",
]
test = ["oxitest", "oxi-nixinfra"]

[tool.oxitest]
testpaths = ["tests"]
strict = "abort"
markers = ["slow: marks tests that require SSH to a live host"]
plugins = ["oxi_nixinfra._plugin"]
